apply plugin: 'com.android.application'

android {
    namespace 'com.nurdun.swipecode'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.nurdun.swipecode'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.5.0'
        testInstrumentationRunner 'com.nurdun.swipecode.KeyboardInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
